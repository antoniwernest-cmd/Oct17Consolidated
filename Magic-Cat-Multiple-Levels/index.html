showCloze=function(){document.querySelector('main').classList.toggle('passage-mode',state.level>=3);if(state.level<3){sentenceCloze();return}const l=state.level,i=state.positions[l],k=key(l,i),s=DATA[l][i],a=state.answers[k],filled=a?.filled||s.blanks.map(()=>false);let n=activeBlanks[k]??filled.findIndex(x=>!x);if(n<0)n=0;activeBlanks[k]=n;const p=el('sentence');p.replaceChildren();let end=0;s.blanks.forEach((b,j)=>{p.append(document.createTextNode(s.text.slice(end,b.start)));const chip=document.createElement('button');chip.className='passage-blank'+(j===n&&!filled[j]?' current':'')+(filled[j]?' completed':'');chip.textContent=filled[j]?b.answer:'_____';chip.setAttribute('aria-label','Select blank '+(j+1));chip.onclick=()=>{activeBlanks[k]=j;showCloze()};p.append(chip);end=b.end});p.append(document.createTextNode(s.text.slice(end)));const box=el('choices');box.replaceChildren();let blank=s.blanks[n],cacheKey=k+'-passage-'+n;let pool=[...new Set(DATA[l].flatMap(s=>s.blanks.map(b=>b.answer)))].filter(w=>w.toLowerCase()!==blank.answer.toLowerCase());if(!optionsCache[cacheKey])optionsCache[cacheKey]=shuffle([blank.answer,...shuffle(pool).slice(0,l===3?2:4)]);const label=document.createElement('p');label.className='passage-choice-label';label.textContent='Blank '+(n+1)+' of '+s.blanks.length;box.append(label);for(const word of optionsCache[cacheKey]){let b=document.createElement('button');b.textContent=word;b.disabled=!!filled[n];if(filled[n]&&word===blank.answer)b.className='correct';else if(a?.lastWords?.[n]===word&&!filled[n])b.className='incorrect';b.onclick=()=>{const r=state.answers[k]||{attempts:0,history:[],filled:s.blanks.map(()=>false),lastWords:s.blanks.map(()=>''),solved:false};r.attempts++;r.last=word;r.lastWords[n]=word;r.filled[n]=word===blank.answer;r.solved=r.filled.every(Boolean);r.date=new Date().toISOString();r.history.push({blank:n+1,choice:word,correct:r.filled[n],date:r.date});state.answers[k]=r;if(r.filled[n]&&!r.solved)activeBlanks[k]=r.filled.findIndex(x=>!x);save();showCloze()};box.append(b)}el('feedback').textContent=(filled.every(Boolean)?'✓ Well done! The passage is complete.':'Choose a word for the highlighted blank.')+' · '+filled.filter(Boolean).length+'/'+s.blanks.length+' complete · Attempts: '+(a?.attempts||0);el('retry').textContent='↻ Try again';el('retry').hidden=!a?.attempts;el('retry').onclick=()=>{const r=state.answers[k];r.solved=false;r.filled=s.blanks.map(()=>false);r.lastWords=s.blanks.map(()=>'');r.last='';activeBlanks[k]=0;Object.keys(optionsCache).filter(x=>x.startsWith(k+'-passage-')).forEach(x=>delete optionsCache[x]);save();showCloze()}}
const sentenceListen=el('listen').onclick;
el('listen').onclick=()=>{if(state.level<3){sentenceListen();return}if(!('speechSynthesis'in window)){el('feedback').textContent='Read-aloud is unavailable in this browser.';return}loadVoices();speechSynthesis.cancel();const s=DATA[state.level][state.positions[state.level]],a=state.answers[key(state.level,state.positions[state.level])];let u=new SpeechSynthesisUtterance(passageText(s,a?.filled,n=>'blank '+(n+1)));u.voice=readingVoices.find(v=>/samantha|susan|zira|jenny|aria|ava|victoria|karen|moira|tessa|serena|female|woman/i.test(v.name))||readingVoices[0]||null;u.lang=u.voice?.lang||'en-US';u.rate=.6;u.pitch=1;speechSynthesis.speak(u)};
const sentenceRows=rows;
rows=function(){return sentenceRows().map((r,index)=>{const l=NAMES.indexOf(r[1]);if(l<3)return r;const i=r[2]-1,s=DATA[l][i],a=state.answers[key(l,i)];r[3]=passageText(s,[],n=>'_____');r[4]=s.blanks.map((b,n)=>'Blank '+(n+1)+': '+b.answer).join('; ');r[6]=a?.solved?'Correct':a?.attempts?'In progress':'Not attempted';r[10]=(a?.history||[]).map((h,n)=>(n+1)+'. Blank '+h.blank+': '+h.choice+' ('+(h.correct?'correct':'incorrect')+', '+h.date+')').join('; ');return r})};
render();



state.orders=DATA.map((list,l)=>[...(state.orders?.[l]||[]),...list.map((_,i)=>i).filter(i=>!state.orders?.[l]?.includes(i))]);
function orderPosition(){return state.orders[state.level].indexOf(state.positions[state.level])}
el('prev').onclick=()=>{const n=orderPosition();if(n>0){state.positions[state.level]=state.orders[state.level][n-1];render()}};
el('next').onclick=()=>{const n=orderPosition();if(n<DATA[state.level].length-1){state.positions[state.level]=state.orders[state.level][n+1];render()}};
const beforeMixRender=render;render=function(){state.positions=DATA.map((_,l)=>state.positions[l]||0);state.orders=DATA.map((list,l)=>[...(state.orders?.[l]||[]),...list.map((_,i)=>i).filter(i=>!state.orders?.[l]?.includes(i))]);beforeMixRender();const n=orderPosition();el('progress').textContent=(n+1)+' / '+DATA[state.level].length;el('prev').disabled=n===0;el('next').disabled=n===DATA[state.level].length-1};
el('mix').onclick=()=>{const l=state.level,old=state.positions[l];state.orders[l]=shuffle(DATA[l].map((_,i)=>i));if(state.orders[l][0]===old)[state.orders[l][0],state.orders[l][1]]=[state.orders[l][1],state.orders[l][0]];state.positions[l]=state.orders[l][0];Object.keys(optionsCache).filter(k=>k.startsWith(l+':')).forEach(k=>delete optionsCache[k]);render();el('status').textContent='New mix ready · Assessment history kept';save()};
render();

function fitScreen(){const main=document.querySelector('main');if(!main)return;const available=window.visualViewport?.height||window.innerHeight;const natural=main.offsetHeight;main.style.setProperty('--screen-fit',Math.min(1,(available-6)/Math.max(1,natural)))}
let fitPending=false;function scheduleFit(){if(fitPending)return;fitPending=true;requestAnimationFrame(()=>{fitPending=false;fitScreen()})}
window.addEventListener('resize',scheduleFit);window.visualViewport?.addEventListener('resize',scheduleFit);if('ResizeObserver'in window)new ResizeObserver(scheduleFit).observe(document.querySelector('main'));document.fonts?.ready.then(scheduleFit);window.addEventListener('load',scheduleFit);scheduleFit();

const stopSpeechNow=()=>{if('speechSynthesis' in window){window.speechSynthesis.cancel();if(window.speechSynthesis.paused)window.speechSynthesis.resume()}el('feedback').textContent='Speech stopped.'};el('stopSpeaking').onpointerdown=stopSpeechNow;el('stopSpeaking').onclick=stopSpeechNow;
</script></body></html>
